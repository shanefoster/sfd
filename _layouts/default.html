<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
{% if page.noindex %}<meta name="robots" content="noindex, nofollow"/>{% endif %}
<meta name="description" content="{{ page.description | default: site.description }}"/>
<title>Editorial Statement - Visionary Leader</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&amp;family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2c1fe0",
                        "background-light": "#ffffff",
                        "background-dark": "#0f0e1b",
                        "surface-light": "#f8fafc",
                        "surface-dark": "#181726",
                        "border-light": "#e2e8f0",
                        "border-dark": "#2d2b42",
                    },
                    fontFamily: {
                        "display": ["Playfair Display", "serif"],
                        "heading": ["Lora", "serif"],
                        "body": ["Merriweather", "serif"],
                        "metric": ["IBM Plex Sans", "ui-sans-serif", "system-ui", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.375rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Merriweather', serif;
        }
        h1, h2, .font-editorial {
            font-family: 'Playfair Display', serif;
        }
        h3, h4, .font-heading {
            font-family: 'Lora', serif;
        }
        .font-metric {
            font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
            font-variant-numeric: tabular-nums;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 2rem;
        }details > summary {
            list-style: none;
        }
        details > summary::-webkit-details-marker {
            display: none;
        }
        details[open] > summary span::after {
            content: "Close experience";
        }
        details:not([open]) > summary span::after {
            content: "See all experience";
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-colors duration-300">
    {% if page.url contains '/casestudies' or page.collection == 'work' %}
        {% include header-casestudies.html %}
    {% else %}
        {% include header.html %}
    {% endif %}
    
    <main class="flex flex-col items-center w-full">
        {{ content }}
    </main>
    
    {% include footer.html %}
</body>
</html>
