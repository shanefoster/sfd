---
layout: default
---

<main class="flex flex-col items-center w-full">
    <section class="w-full overflow-hidden pt-24">
        <div class="max-w-[1200px] mx-auto px-4 md:px-8 flex flex-col items-center text-center">
            <div class="mb-8">
                <span class="text-primary font-heading italic text-lg tracking-wide">{{ page.company }}</span>
            </div>
            <h1 class="text-5xl md:text-8xl font-black text-slate-900 dark:text-white leading-[1.1] mb-16 max-w-5xl">
                {{ page.titlestart }} <span class="italic text-primary">{{ page.titleend }}</span>
            </h1>
            <div
                class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-4 border-t border-b border-slate-200 dark:border-slate-800 py-8 mb-12">
                <div
                    class="flex flex-col items-center md:items-start md:border-r border-slate-200 dark:border-slate-800 md:pl-8">
                    <span class="text-xs uppercase tracking-[0.2em] font-bold text-slate-500 mb-2">Role</span>
                    <span class="font-heading text-lg font-medium text-slate-900 dark:text-white">{{page.role}}</span>
                </div>
                <div
                    class="flex flex-col items-center md:items-start md:border-r border-slate-200 dark:border-slate-800 md:pl-8">
                    <span class="text-xs uppercase tracking-[0.2em] font-bold text-slate-500 mb-2">Team</span>
                    <span class="font-heading text-lg text-left font-medium text-slate-900 dark:text-white">{{ page.team }}</span>
                </div>
                <div class="flex flex-col items-center md:items-start md:pl-8">
                    <span class="text-xs uppercase tracking-[0.2em] font-bold text-slate-500 mb-2">Timeline</span>
                    <span class="font-heading text-lg text-left font-medium text-slate-900 dark:text-white">{{ page.timeline }}</span>
                </div>
            </div>
        </div>
    </section>


{{ content }}

</main>

<div class="w-full max-w-[1200px] px-4 md:px-8 py-8">
    <a href="{{ '/casestudies/' | relative_url }}" class="text-primary hover:underline font-medium">← Back to Case Studies</a>
</div>
